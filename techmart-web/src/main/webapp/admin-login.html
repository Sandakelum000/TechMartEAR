<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMart | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen px-4">

<div id="authToast" class="fixed top-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 border transition-all duration-300 hidden"></div>

<div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200/50 p-8 transition-all">

    <div class="text-center mb-8">
        <div class="inline-flex p-3.5 bg-indigo-50 text-indigo-600 rounded-2xl mb-4">
            <i data-lucide="shield-check" class="w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">TechMart Control Node</h1>
        <p class="text-sm font-medium text-slate-400 mt-1">Provide administrative credentials to open transport pipelines.</p>
    </div>

    <form id="frmAdminLogin" onsubmit="executeAdminAuthPipeline(event)" class="space-y-5">

        <div>
            <label for="txtAuthUser" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">System Username</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </span>
                <input type="text" id="txtAuthUser" required autocomplete="username"
                       class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 placeholder-slate-400 outline-none focus:border-indigo-500 focus:bg-white transition-all"
                       placeholder="admin_root">
            </div>
        </div>

        <div>
            <label for="txtAuthPass" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Cluster Password</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                <input type="password" id="txtAuthPass" required autocomplete="current-password"
                       class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 placeholder-slate-400 outline-none focus:border-indigo-500 focus:bg-white transition-all"
                       placeholder="••••••••••••">
            </div>
        </div>

        <button type="submit" id="btnSubmitAuth"
                class="w-full flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm py-3 px-4 rounded-xl shadow-lg shadow-slate-900/10 hover:shadow-xl transition-all cursor-pointer">
            <span>Establish Session Matrix</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

    </form>
</div>

<script src="assets/js/admin-login.js"></script>
</body>
</html>
