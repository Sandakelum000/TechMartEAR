<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart | TechMart</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

<div id="header-slot"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="toastNotification" class="hidden fixed bottom-5 right-5 z-50 bg-gray-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 transition-all duration-300 transform translate-y-10 opacity-0"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">

        <section class="lg:col-span-2 space-y-4" id="cartItemsSection">
            <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-xs flex items-center justify-between">
                <h2 class="text-lg font-bold text-gray-900">Your Cart</h2>
                <span id="cartCountBadge" class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">0 Items</span>
            </div>

            <div id="cartItemsContainer" class="space-y-4">
            </div>
        </section>

        <aside class="lg:col-span-1 bg-white p-6 rounded-2xl border border-gray-200 shadow-xs h-fit sticky top-24">
            <h3 class="text-base font-bold text-gray-900 mb-4 uppercase tracking-wider">Order Summary</h3>

            <div class="space-y-3 text-sm font-medium text-gray-600">
                <div class="flex justify-between">
                    <span>Subtotal</span>
                    <span id="summarySubtotal" class="text-gray-900 font-semibold">$0.00</span>
                </div>
                <div class="flex justify-between">
                    <span>Estimated Shipping</span>
                    <span class="text-green-600 font-semibold">FREE</span>
                </div>
                <hr class="border-gray-100 my-2">
                <div class="flex justify-between text-base font-bold text-gray-900 pt-2">
                    <span>Total Amount</span>
                    <span id="summaryTotal" class="text-indigo-600 text-lg font-black">$0.00</span>
                </div>
            </div>

            <a href="checkout.html">
            <button class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-xs transition-colors flex items-center justify-center gap-2 cursor-pointer border-none">
                <i data-lucide="credit-card" class="w-5 h-5"></i> Proceed to Checkout
            </button></a>

            <a href="index.html" class="w-full mt-3 text-sm font-semibold text-indigo-600 hover:text-indigo-700 transition-colors flex items-center justify-center gap-2 py-2 border border-transparent hover:border-indigo-100 rounded-xl no-underline">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Continue Shopping
            </a>
        </aside>

    </div>
</main>

<script src="assets/js/header.js"></script>
<script src="assets/js/cart.js"></script>
</body>
</html>
